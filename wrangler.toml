name = "iloc-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Your KV Database (Text & Settings)
[[kv_namespaces]]
binding = "CONTENT_KV"
id = "5b410e671eb14b78bc6bd59b7fd6f827"

# Your R2 Storage (Images & Media)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "iloc-media"
